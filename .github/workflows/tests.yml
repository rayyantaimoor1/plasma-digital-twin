# Continuous Integration for the Plasma Digital Twin platform.
#
# Runs the pytest suite automatically on every push and pull request to main,
# per the FYP scope document's Section 12 ("Continuous Integration (Optional) -
# GitHub Actions - Lightweight CI workflow that runs the pytest suite
# automatically on every push, signalling professional software practice and
# guarding against regressions") and CLAUDE.md ("GitHub Actions CI is optional
# but encouraged once Phase 0 exists").
#
# All random seeds in the project are fixed and recorded (FE-1.3.7), so a CI run
# reproduces the same dataset, models, and metrics as a local run.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the interpreter requirements.txt was pinned against (local dev
          # runs 3.14.5), so the exact `pip freeze` pins resolve cleanly and CI
          # reproduces the recorded environment faithfully. The project's hard
          # floor is 3.12 (XGBoost 3.x / SHAP 0.5x need >= 3.12). The pywin32 pin
          # carries a `sys_platform == "win32"` marker so this Linux runner skips
          # it cleanly.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (excluding the slow dashboard and optional-torch tests)
        # Excludes two groups to keep CI fast and lightweight:
        #   - dashboard: AppTest smoke tests rebuild every cached model per page.
        #   - torch: the OPTIONAL autoencoder (FE-2.2.6) needs PyTorch, which is
        #     not in the base requirements.txt (see requirements-optional.txt);
        #     CI installs only the core deps, so these skip anyway - excluding
        #     them by marker keeps the run explicit.
        # The full engine + AI logic and every non-negotiable principle are
        # covered by the rest of the suite. Run the excluded groups locally with
        # `pytest -m dashboard` and `pytest -m torch`.
        run: pytest -m "not dashboard and not torch" -q
